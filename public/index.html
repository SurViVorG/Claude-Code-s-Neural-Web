<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neural Web</title>
<style>
  :root {
    --bg: #05060f;
    --panel: rgba(12, 14, 32, 0.82);
    --line: rgba(120, 140, 255, 0.18);
    --text: #d9defa;
    --muted: #7a82a8;
    --read: #3ad6ff;
    --edit: #ff4fd8;
    --write: #ff9f40;
    --search: #ffe066;
    --exec: #5dff9b;
    --delete: #ff5470;
    --start: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  canvas.pointer { cursor: pointer; }

  .hud { position: fixed; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 4px;
    pointer-events: none; text-shadow: 0 0 12px rgba(0,0,0,.8); }
  .brand { font-size: 18px; font-weight: 600; letter-spacing: .06em; display: flex; align-items: center; gap: 10px; }
  .status { width: 10px; height: 10px; border-radius: 50%; background: #ff5470; box-shadow: 0 0 10px #ff5470; }
  .status.on { background: var(--exec); box-shadow: 0 0 10px var(--exec); }
  .stats { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 600; }
  .mode { color: var(--search); font-size: 12px; }
  .where { color: var(--muted); font-size: 12px; max-width: min(560px, calc(100vw - 32px)); display: grid; gap: 2px; }
  .where div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .where b { color: var(--text); font-weight: 600; }

  #panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 320px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(10px); }
  #panel.hidden { display: none; }
  #toggle { position: fixed; top: 16px; right: 16px; z-index: 2; }
  #panel .controls { padding: 52px 14px 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button, input[type=search] { font: inherit; color: var(--text); background: rgba(255,255,255,.05);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  select, input[type=search] { width: 100%; }
  button { cursor: pointer; white-space: nowrap; }
  button:hover, select:hover { border-color: rgba(120,140,255,.5); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--read); outline-offset: 1px; }
  label { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px;
    background: var(--c); box-shadow: 0 0 6px var(--c); }
  h3 { margin: 12px 14px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
  #feed { list-style: none; margin: 0; padding: 0 6px 10px; overflow-y: auto; flex: 1; }
  #feed li { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  #feed li:hover { background: rgba(255,255,255,.05); }
  #feed .badge { grid-row: span 2; align-self: center; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 6px; border-radius: 6px; color: #05060f; background: var(--c); font-weight: 700; min-width: 50px; text-align: center; }
  #feed .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  #feed .t { color: var(--muted); font-size: 11px; }
  #feed li.fresh { background: rgba(120,140,255,.14); }
  .empty { color: var(--muted); padding: 12px 14px; font-size: 12px; }
  .empty code { color: var(--text); }

  #tip { position: fixed; pointer-events: none; max-width: 360px; padding: 8px 10px; border-radius: 8px; font-size: 12px;
    background: rgba(8,10,24,.95); border: 1px solid var(--line); display: none; word-break: break-all; z-index: 5; }
  #tip .k { color: var(--muted); }
  .help { position: fixed; left: 16px; bottom: 16px; color: var(--muted); font-size: 11px; pointer-events: none; }

  @media (max-width: 640px) {
    #panel { left: 16px; width: auto; top: auto; height: 45vh; }
    .help { display: none; }
  }
</style>
</head>
<body>
<canvas id="web"></canvas>

<div class="hud">
  <div class="brand"><span class="status" id="status" title="disconnected"></span>NEURAL WEB</div>
  <div class="stats"><b id="sFiles">0</b> files · <b id="sDirs">0</b> dirs · <b id="sEvents">0</b> signals</div>
  <div class="mode" id="mode"></div>
  <div class="where" id="where"></div>
</div>

<button id="toggle" aria-controls="panel" aria-expanded="true">Panel</button>
<aside id="panel">
  <div class="controls">
    <select id="session" aria-label="Session filter"><option value="@live" id="opt-live">Live sessions</option><option value="">All sessions</option></select>
    <input type="search" id="search" placeholder="Highlight path…" aria-label="Highlight path">
    <div class="row">
      <label><input type="checkbox" id="follow"> Follow</label>
      <label><input type="checkbox" id="labels"> All labels</label>
    </div>
    <div class="row">
      <button id="fit">Fit view</button>
      <button id="expand">Expand all</button>
      <button id="collapse">Collapse all</button>
      <button id="clear">Clear log</button>
    </div>
  </div>
  <div class="legend">
    <span style="--c:var(--read)">read</span>
    <span style="--c:var(--edit)">edit</span>
    <span style="--c:var(--write)">write</span>
    <span style="--c:var(--search)">search</span>
    <span style="--c:var(--exec)">exec</span>
    <span style="--c:var(--delete)">delete</span>
    <span style="--c:var(--start)">session start</span>
  </div>
  <h3>Live feed</h3>
  <ol id="feed"></ol>
</aside>

<div id="tip"></div>
<div class="help">scroll to zoom · drag to pan · click a folder to show / hide its contents · click a file to focus it</div>

<script>
(() => {
  'use strict';

  /* ================= config ================= */
  const COLORS = { read: '#3ad6ff', edit: '#ff4fd8', write: '#ff9f40', search: '#ffe066', exec: '#5dff9b', delete: '#ff5470', start: '#ffffff' };
  const IDLE = '#6f7cff';
  const GLOW_MS = 20000;     // how long a touched neuron keeps glowing
  const FEED_MAX = 250;
  // in "Live sessions" mode every open console is shown; one that never sent a
  // SessionEnd (crashed, or hook not installed) counts as closed after this much quiet
  const ACTIVE_MS = 2 * 60 * 60 * 1000;
  // folders start expanded until about this many neurons are on screen; the rest start collapsed
  const OPEN_BUDGET = 1200;

  /* ================= state ================= */
  const canvas = document.getElementById('web');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  let allEvents = [];
  const seen = new Set();
  const sessions = new Map(); // id -> {first, last, root, count, ended, lastEv}
  let mode = '@live';        // '@live' (all open sessions) | '' (all sessions) | a session id
  let shownSet = new Set();  // sessions on the map; null = every session
  let highlight = '';

  let nodes = new Map();     // key(path) -> neuron
  let vis = [];              // neurons currently on screen
  let pulses = [];
  let rings = [];
  let sparks = [];           // small energy packets flowing along active dendrites
  let ghosts = [];           // dendrites retracting into a folder that was just collapsed

  const trees = new Map();   // key(folder) -> directory listing from the server
  const loading = new Set();
  const userOpen = new Map(); // key(folder) -> collapsed? (what the user clicked; survives rebuilds)

  const cam = { x: 0, y: 0, k: 1 };
  const camGoal = { x: 0, y: 0, k: 1, active: false };

  const $ = (id) => document.getElementById(id);

  /* ================= path helpers ================= */
  const norm = (p) => String(p || '').replace(/\\/g, '/').replace(/(.)\/+$/, '$1');
  const key = (p) => (/^[a-z]:\//i.test(p) ? p.toLowerCase() : p);
  const base = (p) => { const s = p.split('/').filter(Boolean); return s.length ? s[s.length - 1] : p; };

  // the directory the session was opened in (its first event, normally the SessionStart)
  const rootOf = (ev) => norm((sessions.get(ev.session) || {}).root || ev.cwd);

  function relPath(ev) {
    const cwd = rootOf(ev), p = norm(ev.path);
    if (cwd && key(p).startsWith(key(cwd) + '/')) return p.slice(cwd.length + 1);
    if (cwd && key(p) === key(cwd)) return base(cwd) + '/';
    return p;
  }

  /* ================= graph building ================= */
  function ensureNode(id, label, full, type, parent) {
    let n = nodes.get(id);
    if (n) {
      if (type !== 'file' && n.type === 'file') n.type = 'dir';
      return n;
    }
    n = {
      id, label, full, type, parent, kids: [],
      x: 0, y: 0, depth: 0, w: 1, shown: false,
      // tx/ty = layout target; x/y = drawn position that glides towards it
      tx: 0, ty: 0, born: 0, g: 1, dg: 0, dc: null, kick: 0, charge: 0,
      hits: 0, last: 0, color: IDLE, actions: {},
      collapsed: userOpen.has(id) ? userOpen.get(id) : undefined,
      loaded: true,           // false = folder listed but its contents not fetched yet
    };
    nodes.set(id, n);
    if (parent) parent.kids.push(n);
    return n;
  }

  // merge a directory listing from /api/tree under neuron n
  function mergeTree(n, t) {
    if (!t.c) { n.loaded = false; return; }
    n.loaded = true;
    for (const c of t.c) {
      const full = n.full + '/' + c.n;
      const cn = ensureNode(key(full), c.n, full, c.d ? 'dir' : 'file', n);
      if (c.d) mergeTree(cn, c);
    }
  }

  function chainFor(ev) {
    const cwd = rootOf(ev), p = norm(ev.path);
    let rootFull, rel;
    if (cwd && (key(p) === key(cwd) || key(p).startsWith(key(cwd) + '/'))) {
      rootFull = cwd; rel = p.slice(cwd.length + 1);
    } else if (ev.kind === 'dir') {
      rootFull = p; rel = '';
    } else {
      const i = p.lastIndexOf('/');
      rootFull = i > 0 ? p.slice(0, i) : p; rel = i > 0 ? p.slice(i + 1) : '';
    }
    const chain = [ensureNode(key(rootFull), base(rootFull), rootFull, 'root', null)];
    let full = rootFull;
    const segs = rel.split('/').filter(Boolean);
    segs.forEach((s, i) => {
      full += '/' + s;
      const type = i === segs.length - 1 && ev.kind === 'file' ? 'file' : 'dir';
      chain.push(ensureNode(key(full), s, full, type, chain[chain.length - 1]));
    });
    return chain;
  }

  function applyEvent(ev, live) {
    const before = nodes.size;
    const chain = chainFor(ev);
    const target = chain[chain.length - 1];
    const color = COLORS[ev.action] || IDLE;
    target.hits++;
    target.actions[ev.action] = (target.actions[ev.action] || 0) + 1;
    target.deleted = ev.action === 'delete';
    if (!live) {
      // the whole path lights up, so a collapsed folder still shows activity inside it
      for (const n of chain) { n.last = Math.max(n.last, ev.ts); n.color = color; }
      return target;
    }
    if (nodes.size !== before) relayout();
    const shownChain = chain.filter((n) => n.shown);
    // hidden neurons light up now; the ones on screen light up as the energy reaches them
    for (const n of chain) if (!n.shown) { n.last = Math.max(n.last, ev.ts); n.color = color; }
    pulses.push({ chain: shownChain, color, t0: performance.now(), lit: 0, dur: 0 });
    if ($('follow').checked) focusOn(shownChain[shownChain.length - 1], Math.max(cam.k, 1));
    return target;
  }

  // folders of the sessions on screen; their full listing is fetched from the server
  function shownRoots() {
    const out = new Map();
    for (const [id, s] of sessions) if (isShown(id) && s.root) out.set(key(norm(s.root)), norm(s.root));
    return [...out.values()];
  }

  function rebuild() {
    nodes = new Map(); pulses = []; rings = []; sparks = []; ghosts = [];
    $('feed').innerHTML = '';
    for (const r of shownRoots()) {
      const rn = ensureNode(key(r), base(r), r, 'root', null);
      const t = trees.get(key(r));
      if (t) mergeTree(rn, t); else loadTree(r, true);
    }
    // folders the user opened later (their contents were fetched separately)
    for (const [k, t] of [...trees].sort((a, b) => a[0].length - b[0].length)) {
      const n = nodes.get(k);
      if (n && n.parent) mergeTree(n, t);
    }
    const list = visibleEvents();
    for (const ev of list) applyEvent(ev, false);
    for (const ev of list.slice(-FEED_MAX)) addFeed(ev, false);
    relayout();
    updateStats();
    updateWhere();
    fit(true);
    renderEmpty();
  }

  function loadTree(full, isRoot) {
    const k = key(full);
    if (loading.has(k)) return;
    loading.add(k);
    fetch('/api/tree?path=' + encodeURIComponent(full))
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        loading.delete(k);
        if (!data) {
          // not listable (outside the session folders): show what Claude touched in it
          const n = nodes.get(k);
          if (n) { n.loaded = true; if (!isRoot) n.collapsed = false; relayout(); }
          return;
        }
        trees.set(k, data.tree);
        if (isRoot) { rebuild(); return; }
        const n = nodes.get(k);
        if (!n) return;
        mergeTree(n, data.tree);
        n.collapsed = false;
        relayout();
        updateStats();
      })
      .catch(() => loading.delete(k));
  }

  /* ================= expand / collapse ================= */
  function setCollapsed(n, c) { n.collapsed = c; userOpen.set(n.id, c); }

  function toggle(n) {
    if (n.type === 'file') return;
    if (n.collapsed && !n.loaded) {
      userOpen.set(n.id, false);
      loadTree(n.full, false);
      return;
    }
    setCollapsed(n, !n.collapsed);
    relayout();
  }

  function revealPath(n) {
    for (let p = n.parent; p; p = p.parent) if (p.collapsed) setCollapsed(p, false);
    relayout();
  }

  // folders the user never clicked: open them breadth-first while there is room
  function applyDefaults() {
    let count = 0;
    const roots = [...nodes.values()].filter((n) => !n.parent);
    const queue = [...roots];
    count += roots.length;
    while (queue.length) {
      const n = queue.shift();
      if (n.type === 'file') continue;
      if (n.collapsed === undefined) {
        n.collapsed = !n.loaded || (n.parent && count + n.kids.length > OPEN_BUDGET);
      }
      if (!n.collapsed) { count += n.kids.length; queue.push(...n.kids); }
    }
  }

  /* ================= layout (static radial tree) ================= */
  const byName = (a, b) => ((a.type === 'file') - (b.type === 'file')) || a.label.localeCompare(b.label, undefined, { numeric: true, sensitivity: 'base' });

  function measure(n, depth) {
    n.depth = depth;
    n.shown = true;
    vis.push(n);
    let maxD = depth;
    if (!n.collapsed && n.kids.length) {
      n.kids.sort(byName);
      n.w = 0;
      for (const c of n.kids) { maxD = Math.max(maxD, measure(c, depth + 1)); n.w += c.w; }
    } else n.w = 1;
    return maxD;
  }

  function place(n, cx, cy, step, a0, a1) {
    const a = (a0 + a1) / 2, r = n.depth * step;
    n.tx = cx + Math.cos(a) * r;
    n.ty = cy + Math.sin(a) * r;
    if (n.collapsed || !n.kids.length) return;
    let s = a0;
    for (const c of n.kids) {
      const span = ((a1 - a0) * c.w) / n.w;
      place(c, cx, cy, step, s, s + span);
      s += span;
    }
  }

  function relayout() {
    const now = performance.now();
    const prev = vis;
    const prevSet = new Set(prev);
    applyDefaults();
    for (const n of nodes.values()) n.shown = false;
    vis = [];
    let cursor = 0;
    for (const r of [...nodes.values()].filter((n) => !n.parent)) {
      const depth = measure(r, 0);
      // ring spacing: enough room on the outer ring for every leaf
      const step = Math.max(80, (r.w * 15) / (2 * Math.PI * Math.max(1, depth)));
      const R = Math.max(60, step * depth);
      const cx = cursor + R;
      place(r, cx, 0, step, -Math.PI / 2, Math.PI * 1.5);
      cursor = cx + R + 160;
    }
    // keep the whole picture centred on the origin
    const shift = cursor > 0 ? (cursor - 160) / 2 : 0;
    for (const n of vis) n.tx -= shift;

    // neurons that just appeared grow out of their parent, one ring after another
    const fresh = vis.filter((n) => !prevSet.has(n));
    const minD = fresh.reduce((m, n) => Math.min(m, n.depth), Infinity);
    for (const n of fresh) {  // preorder: a parent is placed before its children
      n.born = now + Math.min(900, (n.depth - minD) * 80);
      n.g = 0;
      if (n.parent) { n.x = n.parent.x; n.y = n.parent.y; } else { n.x = n.tx; n.y = n.ty; }
    }
    // neurons that just disappeared retract into the folder that hid them
    for (const n of prev) {
      if (!n.shown && nodes.get(n.id) === n && n.g > 0.05) ghosts.push({ n, t0: now, fx: n.x, fy: n.y, x: n.x, y: n.y });
    }
    updateStats();
  }

  /* ================= sessions ================= */
  const isShown = (id) => !shownSet || shownSet.has(id);
  const visibleEvents = () => allEvents.filter((e) => e.action !== 'end' && isShown(e.session));

  // every session that is still open (no SessionEnd, not idle for ACTIVE_MS);
  // if none is, the most recent one so the map never goes blank
  function liveSessions() {
    const now = Date.now(), out = new Set();
    for (const [id, s] of sessions) if (!s.ended && now - s.last < ACTIVE_MS) out.add(id);
    if (!out.size) { const l = latestSession(); if (l) out.add(l); }
    return out;
  }
  const computeShown = () => (mode === '@live' ? liveSessions() : mode ? new Set([mode]) : null);
  const sameSet = (a, b) => a && b && a.size === b.size && [...a].every((x) => b.has(x));

  // live mode: a console opened or closed -> redraw with the new set of sessions
  function refreshLive() {
    if (mode !== '@live') return false;
    const next = liveSessions();
    if (sameSet(next, shownSet)) return false;
    shownSet = next;
    updateLiveLabel();
    rebuild();
    return true;
  }

  function ingest(ev, live) {
    if (!ev || !ev.path || seen.has(ev.id)) return;
    seen.add(ev.id);
    allEvents.push(ev);
    trackSession(ev);
    if (!live) return;
    if (refreshLive()) return;
    if (ev.action === 'end' || !isShown(ev.session)) return;
    applyEvent(ev, true);
    addFeed(ev, true);
    updateStats();
    updateWhere();
    renderEmpty();
  }

  function latestSession() {
    let best = '', bestTs = -1;
    for (const [id, s] of sessions) if (s.last > bestTs) { best = id; bestTs = s.last; }
    return best;
  }

  const sessionName = (s) => `${base(norm(s.root)) || '?'} · ${new Date(s.first).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`;

  function updateLiveLabel() {
    const ids = mode === '@live' && shownSet ? [...shownSet].filter((id) => sessions.has(id)) : [];
    $('opt-live').textContent = ids.length
      ? `Live sessions (${ids.length}) — ${ids.map((id) => base(norm(sessions.get(id).root))).join(', ')}`
      : 'Live sessions';
  }

  // HUD: where the shown sessions were opened, and where Claude is working now
  function updateWhere() {
    const el = $('where');
    el.innerHTML = '';
    const ids = (shownSet ? [...shownSet] : []).filter((id) => sessions.has(id));
    const line = (label, value) => {
      const d = document.createElement('div');
      const b = document.createElement('b');
      b.textContent = value;
      d.append(label + ' ', b);
      d.title = value;
      el.appendChild(d);
    };
    const dirOf = (ev) => { const p = norm(ev.path); return ev.kind === 'dir' ? p : p.slice(0, p.lastIndexOf('/')) || p; };
    if (ids.length === 1) {
      const s = sessions.get(ids[0]);
      line('opened in', norm(s.root));
      if (s.lastEv) line('working in', dirOf(s.lastEv));
      return;
    }
    for (const id of ids.slice(0, 6)) {
      const s = sessions.get(id);
      line(base(norm(s.root)) + ' →', s.lastEv ? dirOf(s.lastEv) : norm(s.root));
    }
  }

  function trackSession(ev) {
    let s = sessions.get(ev.session);
    if (!s) {
      s = { first: ev.ts, last: ev.ts, root: ev.action === 'start' ? ev.path : ev.cwd, count: 0 };
      sessions.set(ev.session, s);
      const opt = document.createElement('option');
      opt.value = ev.session;
      opt.id = 'opt-' + ev.session;
      $('session').appendChild(opt);
    }
    s.ended = ev.action === 'end';
    if (ev.action === 'end') return;
    if (ev.action !== 'start') s.lastEv = ev;
    s.count++;
    s.last = Math.max(s.last, ev.ts);
    const opt = document.getElementById('opt-' + ev.session);
    if (opt) opt.textContent = `${sessionName(s)} · ${s.count}`;
  }

  function resetAll() {
    allEvents = []; seen.clear(); sessions.clear();
    $('session').innerHTML = '<option value="@live" id="opt-live">Live sessions</option><option value="">All sessions</option>';
    if (mode !== '@live') mode = '';
    $('session').value = mode;
    shownSet = computeShown();
    updateLiveLabel();
    rebuild();
  }

  /* ================= feed + stats ================= */
  function addFeed(ev, fresh) {
    const li = document.createElement('li');
    li.style.setProperty('--c', COLORS[ev.action] || IDLE);
    if (fresh) { li.className = 'fresh'; setTimeout(() => li.classList.remove('fresh'), 1500); }
    const badge = document.createElement('span');
    badge.className = 'badge'; badge.textContent = ev.action;
    const p = document.createElement('span');
    p.className = 'p'; p.textContent = '‎' + relPath(ev); p.title = ev.path;
    const t = document.createElement('span');
    t.className = 't'; t.textContent = `${new Date(ev.ts).toLocaleTimeString()} · ${ev.tool}`;
    li.append(badge, p, t);
    li.addEventListener('click', () => {
      const n = nodes.get(key(norm(ev.path))) || chainFor(ev).pop();
      revealPath(n);
      $('follow').checked = false;
      focusOn(n, Math.max(cam.k, 1.6));
      rings.push({ n, color: COLORS[ev.action], t0: performance.now() });
    });
    const feed = $('feed');
    feed.prepend(li);
    while (feed.children.length > FEED_MAX) feed.lastChild.remove();
  }

  function updateStats() {
    let f = 0, d = 0;
    for (const n of nodes.values()) n.type === 'file' ? f++ : d++;
    $('sFiles').textContent = f;
    $('sDirs').textContent = d;
    $('sEvents').textContent = visibleEvents().length;
  }

  function renderEmpty() {
    let el = document.querySelector('.empty');
    if (nodes.size) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.className = 'empty';
      el.innerHTML = 'No activity yet. Make sure the <code>PostToolUse</code> hook is installed (see README), then ask Claude to read or edit something.';
      $('feed').before(el);
    }
  }

  /* ================= camera ================= */
  const toWorld = (sx, sy) => [(sx - W / 2) / cam.k + cam.x, (sy - H / 2) / cam.k + cam.y];
  const panelOpen = () => !$('panel').classList.contains('hidden');
  const panelShift = (k) => (panelOpen() && W > 640 ? 180 / k : 0);

  function focusOn(n, k) {
    if (!n) return;
    Object.assign(camGoal, { x: n.tx + panelShift(k), y: n.ty, k, active: true });
  }

  function fit(instant) {
    if (!vis.length) { Object.assign(camGoal, { x: 0, y: 0, k: 1, active: true }); return; }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of vis) { x0 = Math.min(x0, n.tx); y0 = Math.min(y0, n.ty); x1 = Math.max(x1, n.tx); y1 = Math.max(y1, n.ty); }
    const usableW = W - (panelOpen() && W > 640 ? 360 : 0) - 80;
    const k = Math.max(0.05, Math.min(2.2, usableW / (x1 - x0 + 80), (H - 120) / (y1 - y0 + 80)));
    Object.assign(camGoal, { x: (x0 + x1) / 2 + panelShift(k), y: (y0 + y1) / 2, k, active: true });
    if (instant) Object.assign(cam, { x: camGoal.x, y: camGoal.y, k: camGoal.k });
  }

  /* ================= rendering ================= */
  function radius(n) {
    if (n.type === 'root') return 11;
    if (n.type === 'dir') return Math.min(10, 4.5 + Math.sqrt(n.kids.length) * 0.8);
    return Math.min(9, 3 + Math.sqrt(n.hits) * 1.1);
  }

  function rgba(hex, a) {
    const v = parseInt(hex.slice(1), 16);
    return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${a})`;
  }

  const matches = (n) => highlight && n.full.toLowerCase().includes(highlight);

  // edges bend slightly so the web reads as dendrites rather than spokes
  function ctrl(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    return [mx - (b.y - a.y) * 0.12, my + (b.x - a.x) * 0.12];
  }

  /* ---------- animation helpers ---------- */
  const GROW_MS = 520;       // a new dendrite takes this long to reach its neuron
  const GHOST_MS = 380;      // a hidden dendrite takes this long to retract
  const SPARK_MAX = 220;
  const rgbCache = {};
  const hexRgb = (h) => rgbCache[h] || (rgbCache[h] = (() => { const v = parseInt(h.slice(1), 16); return [v >> 16, (v >> 8) & 255, v & 255]; })());
  const IDLE_RGB = hexRgb(IDLE);
  const col = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${Math.max(0, Math.min(1, a))})`;
  // frame-rate independent smoothing: fraction of the way to go after dt ms
  const ease = (dt, tau) => 1 - Math.exp(-dt / tau);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const easeIn = (t) => t * t * t;
  const easeInOut = (t) => 0.5 - Math.cos(Math.PI * t) / 2;
  const clamp01 = (t) => Math.max(0, Math.min(1, t));
  const quadAt = (a, c, b, u) => { const v = 1 - u; return v * v * a + 2 * v * u * c + u * u * b; };

  function edgePoint(a, b, u) {
    const [cx, cy] = ctrl(a, b);
    return [quadAt(a.x, cx, b.x, u), quadAt(a.y, cy, b.y, u)];
  }

  function chainLengths(ch) {
    const L = [0];
    for (let i = 1; i < ch.length; i++) L.push(L[i - 1] + Math.hypot(ch[i].x - ch[i - 1].x, ch[i].y - ch[i - 1].y) * 1.02);
    return L;
  }

  function chainPoint(ch, L, d) {
    let i = 0;
    while (i < ch.length - 2 && L[i + 1] < d) i++;
    const u = clamp01((d - L[i]) / ((L[i + 1] - L[i]) || 1));
    return edgePoint(ch[i], ch[i + 1], u);
  }

  // energy reached this neuron: it flashes, swells, and the dendrite into it charges up
  function lightNode(n, color) {
    n.last = Math.max(n.last, Date.now());
    n.color = color;
    n.kick = 1;
    n.charge = 1;
  }

  // if animations are dropped, the neurons they were heading to still light up
  function flushPulses() {
    for (const p of pulses) for (let i = p.lit; i < p.chain.length; i++) lightNode(p.chain[i], p.color);
    pulses = [];
  }

  // per-frame state: positions glide, colours and glow blend, new dendrites grow
  function step(now, dt, wall) {
    const kp = ease(dt, 170), kc = ease(dt, 280), kg = ease(dt, 140);
    const kk = ease(dt, 320), kq = ease(dt, 750);
    for (const n of vis) {
      const gT = n.last ? Math.exp(-(wall - n.last) / GLOW_MS) : 0;
      const mix = Math.min(1, gT / 0.12);  // fade back to idle blue as the glow dies out
      const src = hexRgb(n.color);
      const r = IDLE_RGB[0] + (src[0] - IDLE_RGB[0]) * mix;
      const g = IDLE_RGB[1] + (src[1] - IDLE_RGB[1]) * mix;
      const b = IDLE_RGB[2] + (src[2] - IDLE_RGB[2]) * mix;
      if (!n.dc) { n.dc = [r, g, b]; n.dg = gT; }
      else {
        n.dc[0] += (r - n.dc[0]) * kc; n.dc[1] += (g - n.dc[1]) * kc; n.dc[2] += (b - n.dc[2]) * kc;
        n.dg += (gT - n.dg) * kg;
      }
      n.kick -= n.kick * kk;
      n.charge -= n.charge * kq;

      const grow = n.born ? clamp01((now - n.born) / GROW_MS) : 1;
      n.g = easeOut(grow);
      if (grow < 1 && n.parent) {
        // ride out along the dendrite from the parent to the layout position
        const p = n.parent, t = { x: n.tx, y: n.ty };
        const [cx, cy] = ctrl(p, t);
        n.x = quadAt(p.x, cx, n.tx, n.g);
        n.y = quadAt(p.y, cy, n.ty, n.g);
      } else {
        n.x += (n.tx - n.x) * kp;
        n.y += (n.ty - n.y) * kp;
      }

      // active dendrites keep carrying small packets of energy outwards
      if (n.parent && n.g >= 1 && n.dg > 0.08 && sparks.length < SPARK_MAX && Math.random() < n.dg * dt * 0.0011) {
        sparks.push({ n, t0: now, dur: 650 + Math.random() * 550 });
      }
    }
  }

  function draw(now, dt) {
    const wall = Date.now();
    step(now, dt, wall);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
    bg.addColorStop(0, '#0b0e24'); bg.addColorStop(1, '#03040b');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    const k = cam.k, sk = Math.sqrt(k);
    ctx.setTransform(DPR * k, 0, 0, DPR * k, DPR * (W / 2 - cam.x * k), DPR * (H / 2 - cam.y * k));

    // synapses
    ctx.globalCompositeOperation = 'lighter';
    for (const n of vis) {
      if (!n.parent || n.g <= 0.001) continue;
      const glow = n.dg, ch = n.charge;
      ctx.strokeStyle = matches(n) ? 'rgba(255,255,255,.6)' : col(n.dc, (0.12 + glow * 0.55 + ch * 0.6) * (0.3 + 0.7 * n.g));
      ctx.lineWidth = (0.8 + glow * 1.6 + ch * 2.2) / sk;
      const p = n.parent;
      const [cx, cy] = ctrl(p, n);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.quadraticCurveTo(cx, cy, n.x, n.y);
      ctx.stroke();
    }

    // dendrites retracting into a collapsed folder
    const gpos = new Map();
    ghosts = ghosts.filter((gh) => {
      const n = gh.n;
      const t = (now - gh.t0) / GHOST_MS;
      if (t >= 1 || n.shown || nodes.get(n.id) !== n) return false;
      let anchor = n.parent;
      while (anchor && !anchor.shown) anchor = anchor.parent;
      if (!anchor) return false;
      const u = 1 - easeIn(clamp01(t));
      gh.x = anchor.x + (gh.fx - anchor.x) * u;
      gh.y = anchor.y + (gh.fy - anchor.y) * u;
      gpos.set(n, gh);
      const from = n.parent.shown ? n.parent : gpos.get(n.parent) || anchor;
      const c = n.dc || IDLE_RGB, a = 1 - t;
      ctx.strokeStyle = col(c, (0.12 + n.dg * 0.5) * a);
      ctx.lineWidth = (0.8 + n.dg * 1.6) / sk;
      const [cx, cy] = ctrl(from, gh);
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.quadraticCurveTo(cx, cy, gh.x, gh.y); ctx.stroke();
      ctx.fillStyle = col(c, 0.5 * a);
      ctx.beginPath(); ctx.arc(gh.x, gh.y, radius(n) * u, 0, Math.PI * 2); ctx.fill();
      return true;
    });

    // ambient energy packets flowing along active dendrites
    sparks = sparks.filter((s) => {
      const n = s.n, t = (now - s.t0) / s.dur;
      if (t >= 1 || !n.shown || !n.parent) return false;
      const [x, y] = edgePoint(n.parent, n, easeInOut(t));
      const a = Math.sin(Math.PI * t) * (0.35 + 0.65 * Math.sqrt(n.dg));
      const r = 2.2 / sk;
      ctx.fillStyle = col(n.dc, a * 0.22);
      ctx.beginPath(); ctx.arc(x, y, r * 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = col(n.dc, a);
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      return true;
    });

    // action potentials travelling down the dendrites, leaving a comet trail
    pulses = pulses.filter((p) => {
      const ch = p.chain;
      const segs = ch.length - 1;
      if (segs < 0) return false;
      if (ch.some((n) => !n.shown)) { for (let i = p.lit; i < ch.length; i++) lightNode(ch[i], p.color); return false; }
      const L = chainLengths(ch), total = L[segs];
      if (!p.dur) p.dur = segs ? Math.max(380, Math.min(1700, total / 0.75)) : 260;
      // the frame timestamp can be a little older than t0 (set in an event handler)
      const t = clamp01((now - p.t0) / p.dur);
      const d = total * easeInOut(t);
      while (p.lit <= segs && L[p.lit] <= d + 0.5) lightNode(ch[p.lit++], p.color);
      if (t >= 1) {
        while (p.lit <= segs) lightNode(ch[p.lit++], p.color);
        rings.push({ n: ch[segs], color: p.color, t0: now });
        return false;
      }
      const rgb = hexRgb(p.color);
      if (segs) {
        const TRAIL = 16, gap = 5;
        for (let i = TRAIL; i >= 1; i--) {
          const dd = d - i * gap;
          if (dd < 0) continue;
          const [x, y] = chainPoint(ch, L, dd);
          const f = 1 - i / TRAIL;
          ctx.fillStyle = col(rgb, 0.08 + f * 0.45);
          ctx.beginPath(); ctx.arc(x, y, 1 + f * 4, 0, Math.PI * 2); ctx.fill();
        }
      }
      const [x, y] = segs ? chainPoint(ch, L, d) : [ch[0].x, ch[0].y];
      const flick = 1 + Math.sin(now / 45) * 0.12;
      const R = 15 * flick;
      const g = ctx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.15, col(rgb, 0.95)); g.addColorStop(0.4, col(rgb, 0.35)); g.addColorStop(1, col(rgb, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
      return true;
    });

    // firing rings (two staggered waves)
    rings = rings.filter((r) => {
      const t = Math.max(0, (now - r.t0) / 1100);
      if (t >= 1 || !r.n.shown) return false;
      for (const [off, s] of [[0, 1], [0.18, 0.6]]) {
        const u = (t - off) / (1 - off);
        if (u <= 0) continue;
        const e = easeOut(u);
        ctx.strokeStyle = rgba(r.color, (1 - u) * 0.85 * s);
        ctx.lineWidth = (2.2 - u * 1.4) / k;
        ctx.beginPath(); ctx.arc(r.n.x, r.n.y, radius(r.n) + e * 30 * s, 0, Math.PI * 2); ctx.stroke();
      }
      return true;
    });

    // neurons
    for (const n of vis) {
      if (n.g <= 0.01) continue;
      const glow = n.dg, c = n.dc, a = n.g;
      const r = radius(n) * (0.35 + 0.65 * n.g) * (1 + 0.5 * n.kick);
      if (glow > 0.02 || n.type !== 'file') {
        const halo = r * (2.2 + glow * 3 + n.kick * 2);
        const g = ctx.createRadialGradient(n.x, n.y, r * 0.3, n.x, n.y, halo);
        g.addColorStop(0, col(c, (0.25 + glow * 0.5 + n.kick * 0.3) * a)); g.addColorStop(1, col(c, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, halo, 0, Math.PI * 2); ctx.fill();
      }
      // files Claude never touched are dimmer than the ones it did
      const fileA = n.hits ? 0.55 + glow * 0.45 : 0.3;
      ctx.fillStyle = col(c, (n.type === 'file' ? fileA : 0.25 + glow * 0.4) * a);
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
      if (n.kick > 0.02) {
        ctx.fillStyle = `rgba(255,255,255,${n.kick * 0.7 * a})`;
        ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.55, 0, Math.PI * 2); ctx.fill();
      }
      if (n.type !== 'file') {
        ctx.strokeStyle = col(c, (0.7 + glow * 0.3) * a); ctx.lineWidth = 1.4 / sk; ctx.stroke();
        ctx.fillStyle = `rgba(255,255,255,${(0.6 + glow * 0.4) * a})`;
        ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.35, 0, Math.PI * 2); ctx.fill();
        if (n.collapsed) {
          // dashed outer ring = folder with hidden contents; it turns while there is activity inside
          ctx.setLineDash([3 / k, 3 / k]);
          ctx.lineDashOffset = glow > 0.05 ? (-now * 0.008 * glow) / k : 0;
          ctx.strokeStyle = col(c, 0.8 * a); ctx.lineWidth = 1.2 / k;
          ctx.beginPath(); ctx.arc(n.x, n.y, r + 4 / k + 2, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]); ctx.lineDashOffset = 0;
        }
      }
      if (n.deleted) {
        ctx.strokeStyle = rgba(COLORS.delete, 0.9 * a); ctx.lineWidth = 1.5 / k;
        ctx.beginPath(); ctx.moveTo(n.x - r, n.y - r); ctx.lineTo(n.x + r, n.y + r); ctx.stroke();
      }
      if (matches(n)) {
        ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2 / k;
        ctx.beginPath(); ctx.arc(n.x, n.y, r + 5 / k, 0, Math.PI * 2); ctx.stroke();
      }
    }

    // labels
    ctx.globalCompositeOperation = 'source-over';
    const allLabels = $('labels').checked;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const n of vis) {
      if (n.g < 0.4) continue;
      const glow = n.dg;
      const show = n.type === 'root' || n === hover || matches(n) || allLabels || glow > 0.25 ||
        (n.type === 'dir' && k > 0.6) || (n.type === 'file' && k > 1.3);
      if (!show) continue;
      const fade = (n.g - 0.4) / 0.6;
      const size = (n.type === 'root' ? 13 : 11) / k;
      ctx.font = `${n.type === 'file' ? 400 : 600} ${size}px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = n.type === 'root' ? `rgba(255,255,255,${fade})` : rgba('#d9defa', ((n.type === 'file' && !n.hits ? 0.45 : 0.6) + glow * 0.4) * fade);
      ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 4;
      const label = n.collapsed && n.type !== 'file' ? `${n.label} (${n.loaded ? n.kids.length : '…'})` : n.label;
      ctx.fillText(label, n.x, n.y + radius(n) + 4 / k);
      ctx.shadowBlur = 0;
    }
  }

  let lastNow = 0;
  function frame(now) {
    // schedule the next frame first: an error while drawing must never freeze the map
    requestAnimationFrame(frame);
    const dt = lastNow ? Math.min(100, Math.max(0, now - lastNow)) : 16;
    lastNow = now;
    if (camGoal.active) {
      const a = ease(dt, 100);
      cam.x += (camGoal.x - cam.x) * a;
      cam.y += (camGoal.y - cam.y) * a;
      cam.k += (camGoal.k - cam.k) * a;
      if (Math.abs(camGoal.x - cam.x) + Math.abs(camGoal.y - cam.y) < 0.5 && Math.abs(camGoal.k - cam.k) < 0.002) {
        Object.assign(cam, { x: camGoal.x, y: camGoal.y, k: camGoal.k });
        camGoal.active = false;
      }
    }
    try {
      draw(now, dt);
    } catch (err) {
      console.error('[neural-web] draw error', err);
      // drop the animation that failed
      try { flushPulses(); } catch (e) { pulses = []; }
      rings = []; sparks = []; ghosts = [];
      ctx.globalCompositeOperation = 'source-over';
      ctx.setLineDash([]);
    }
  }

  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
  }

  /* ================= interaction ================= */
  let hover = null, panStart = null, moved = false;

  function nodeAt(sx, sy) {
    const [x, y] = toWorld(sx, sy);
    let best = null, bestD = Infinity;
    for (const n of vis) {
      const d = Math.hypot(n.x - x, n.y - y);
      const hit = radius(n) + 6 / cam.k;
      if (d < hit && d < bestD) { best = n; bestD = d; }
    }
    return best;
  }

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    moved = false;
    panStart = { sx: e.clientX, sy: e.clientY, x: cam.x, y: cam.y };
  });

  canvas.addEventListener('pointermove', (e) => {
    if (panStart) {
      const dx = e.clientX - panStart.sx, dy = e.clientY - panStart.sy;
      if (Math.abs(dx) + Math.abs(dy) > 3) {
        moved = true; camGoal.active = false; $('follow').checked = false;
        canvas.classList.add('dragging');
      }
      if (moved) { cam.x = panStart.x - dx / cam.k; cam.y = panStart.y - dy / cam.k; }
    }
    hover = nodeAt(e.clientX, e.clientY);
    canvas.classList.toggle('pointer', !!hover && !panStart);
    showTip(hover, e.clientX, e.clientY);
  });

  const endPan = (e) => {
    if (panStart && !moved && e.type === 'pointerup') {
      const n = nodeAt(e.clientX, e.clientY);
      if (n && n.type !== 'file') toggle(n);
      else if (n) { $('follow').checked = false; focusOn(n, Math.max(cam.k, 1.6)); rings.push({ n, color: n.color, t0: performance.now() }); }
    }
    panStart = null; canvas.classList.remove('dragging');
  };
  canvas.addEventListener('pointerup', endPan);
  canvas.addEventListener('pointercancel', endPan);
  canvas.addEventListener('pointerleave', () => { hover = null; $('tip').style.display = 'none'; });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const [wx, wy] = toWorld(e.clientX, e.clientY);
    cam.k = Math.max(0.03, Math.min(6, cam.k * Math.exp(-e.deltaY * 0.0015)));
    cam.x = wx - (e.clientX - W / 2) / cam.k;
    cam.y = wy - (e.clientY - H / 2) / cam.k;
    camGoal.active = false;
  }, { passive: false });

  function ago(ts) {
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.round(s / 60)}m ago`;
    if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    return new Date(ts).toLocaleString();
  }

  function showTip(n, x, y) {
    const tip = $('tip');
    if (!n) { tip.style.display = 'none'; return; }
    const acts = Object.entries(n.actions).map(([a, c]) => `<span style="color:${COLORS[a]}">${a} ${c}</span>`).join(' · ');
    tip.innerHTML = '';
    const title = document.createElement('div');
    title.style.fontWeight = '600';
    title.textContent = n.full;
    tip.appendChild(title);
    const meta = document.createElement('div');
    meta.innerHTML = `<span class="k">${n.type}</span>` +
      (n.hits ? ` · ${n.hits} touch${n.hits > 1 ? 'es' : ''}` : '') +
      (n.kids.length ? ` · ${n.kids.length} item${n.kids.length > 1 ? 's' : ''}` : '') +
      (n.last ? ` · <span class="k">${ago(n.last)}</span>` : '');
    tip.appendChild(meta);
    if (acts) { const d = document.createElement('div'); d.innerHTML = acts; tip.appendChild(d); }
    if (n.type !== 'file') {
      const d = document.createElement('div');
      d.className = 'k';
      d.textContent = n.collapsed ? 'click to show contents' : 'click to hide contents';
      tip.appendChild(d);
    }
    tip.style.display = 'block';
    const tx = Math.min(x + 14, W - tip.offsetWidth - 8), ty = Math.min(y + 14, H - tip.offsetHeight - 8);
    tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
  }

  $('fit').addEventListener('click', () => { $('follow').checked = false; fit(false); });
  $('expand').addEventListener('click', () => {
    for (const n of nodes.values()) if (n.type !== 'file' && n.loaded) setCollapsed(n, false);
    relayout(); fit(false);
  });
  $('collapse').addEventListener('click', () => {
    for (const n of nodes.values()) if (n.type !== 'file') setCollapsed(n, !!n.parent);
    relayout(); fit(false);
  });
  $('session').addEventListener('change', (e) => {
    mode = e.target.value;
    shownSet = computeShown();
    updateLiveLabel();
    rebuild();
  });
  $('search').addEventListener('input', (e) => { highlight = e.target.value.trim().toLowerCase(); });
  $('toggle').addEventListener('click', () => {
    const hidden = $('panel').classList.toggle('hidden');
    $('toggle').setAttribute('aria-expanded', String(!hidden));
  });
  $('clear').addEventListener('click', async () => {
    if (!confirm('Clear the whole activity log? This cannot be undone.')) return;
    await fetch('/api/clear', { method: 'POST' });
    resetAll();
  });
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'f') fit(false);
  });

  /* ================= data ================= */
  function connect() {
    const status = $('status');
    let buffer = [];   // live events that arrive before history is loaded
    let ready = false;
    const es = new EventSource('/api/stream');
    es.onopen = () => { status.classList.add('on'); status.title = 'connected'; };
    es.onerror = () => { status.classList.remove('on'); status.title = 'disconnected — retrying'; };
    es.onmessage = (m) => {
      const msg = JSON.parse(m.data);
      if (msg.type === 'reset') { resetAll(); return; }
      if (msg.type !== 'event') return;
      if (ready) ingest(msg.event, true); else buffer.push(msg.event);
    };

    fetch('/api/history').then((r) => r.json()).then((data) => {
      if (data.demo) $('mode').textContent = 'demo mode — synthetic activity';
      for (const ev of data.events) ingest(ev, false);
      shownSet = computeShown();
      updateLiveLabel();
      rebuild();
      ready = true;
      for (const ev of buffer) ingest(ev, true);
      buffer = [];
    }).catch(() => { ready = true; });
  }

  // drop consoles that went quiet without a SessionEnd
  setInterval(refreshLive, 30000);

  resize();
  renderEmpty();
  connect();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
